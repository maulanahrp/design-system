  <div class="mh-alert mh-alert--success" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg><div><strong class="mh-alert__title">Penawaran terkirim</strong>Klien akan menerima email dalam beberapa menit.</div></div>

    <div class="mh-toast" role="status">Perubahan disimpan.</div>
    <div style="flex:1;min-width:160px"><div class="mh-progress" role="progressbar" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" aria-label="Progres proyek"><div class="mh-progress__bar" style="--value:64%"></div></div></div>
