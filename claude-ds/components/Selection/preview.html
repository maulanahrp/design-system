    <legend class="mh-label" style="margin-bottom:8px">Anggaran</legend>
    <label class="mh-check"><input type="radio" name="b" checked> &lt; Rp50 juta</label>

    <label class="mh-check"><input type="radio" name="b"> &gt; Rp200 juta</label>

  </div>
</div>
